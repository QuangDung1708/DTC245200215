server:
  http_listen_port: 9080
  grpc_listen_port: 0
positions:
  filename: /tmp/positions.yaml
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: uniforum
    static_configs:
      - targets: [localhost]
        labels:
          job: webapp
          application: uniforum
          __path__: /logs/app/*.log
      - targets: [localhost]
        labels:
          job: nginx
          application: uniforum
          __path__: /logs/nginx/*.log
